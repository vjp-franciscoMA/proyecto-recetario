<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi recetario</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header>
        <h1 id="titulo">Mi recetario</h1>
        <p id="resumen"></p>
    </header>

    <!-- Buscador y botones para ordenar las recetas -->
    <section class="controles">
        <input id="buscador" type="search" placeholder="Buscar...">
        <button id="ordenNombre">Ordenar A-Z</button>
        <button id="ordenTiempo">Ordenar por tiempo</button>
    </section>

    <p id="estadisticas"></p>

    <main id="listado"></main>

    <script src="js/app.js" defer></script>

</body>
</html>
